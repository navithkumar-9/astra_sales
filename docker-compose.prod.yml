services:
  # ──────────────────────────────────────────────
  # MySQL 8.0
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: astra_mysql_prod
    restart: always
    env_file: .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Redis 7 (Cache + Celery Result Backend)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: astra_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # RabbitMQ 3 (Message Broker)
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: astra_rabbitmq_prod
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI
      - "15692:15692"   # Prometheus metrics port
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Django Backend (Production — Gunicorn)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./Backend/astra_sales
      dockerfile: Dockerfile
      target: production
    container_name: astra_backend_prod
    restart: always
    env_file: .env.docker
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Celery Worker
  # ──────────────────────────────────────────────
  celery_worker:
    build:
      context: ./Backend/astra_sales
      dockerfile: Dockerfile
      target: production
    container_name: astra_celery_worker_prod
    restart: always
    env_file: .env.docker
    command: celery -A astra_sales worker --loglevel=info
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # React Frontend + Nginx SPA Proxy
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend/frontend_admin
      dockerfile: Dockerfile
      target: production
    container_name: astra_frontend_prod
    restart: always
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - backend
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Prometheus (Metrics Collection)
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: astra_prometheus_prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - backend
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Grafana (Metrics Visualization)
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: astra_grafana_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - prometheus
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # MySQL Exporter
  # ──────────────────────────────────────────────
  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: astra_mysql_exporter_prod
    restart: always
    volumes:
      - ./prometheus/.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Redis Exporter
  # ──────────────────────────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: astra_redis_exporter_prod
    restart: always
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Celery Exporter
  # ──────────────────────────────────────────────
  celery_exporter:
    build:
      context: ./Backend/astra_sales
      dockerfile: Dockerfile
      target: production
    container_name: astra_celery_exporter_prod
    restart: always
    env_file: .env.docker
    command: celery-prometheus-exporter --broker amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # cAdvisor (Container Resource Metrics)
  # ──────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: astra_cadvisor_prod
    restart: always
    privileged: true
    command:
      - '--docker_only=true'
      - '--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory'
      - '--housekeeping_interval=30s'
      - '--store_container_labels=false'
      - '--logtostderr=false'
      - '--log_dir=/tmp'
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - astra_network_prod

  # ──────────────────────────────────────────────
  # Node Exporter (Host System Metrics)
  # ──────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    container_name: astra_node_exporter_prod
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - astra_network_prod

# ──────────────────────────────────────────────
# Persistent Volumes
# ──────────────────────────────────────────────
volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  rabbitmq_data_prod:
    driver: local
  prometheus_data_prod:
    driver: local
  grafana_data_prod:
    driver: local

# ──────────────────────────────────────────────
# Network
# ──────────────────────────────────────────────
networks:
  astra_network_prod:
    driver: bridge
